name: Search Quality

on:
  # Manual-only. The nightly schedule was removed 2026-08-03: meaningful
  # evaluation needs a real LLM provider (Ollama with models, or
  # Claude/OpenAI keys), which GitHub-hosted runners can't provide — the
  # free-tier stack never becomes healthy on a hosted runner, and the run
  # failed every night for 20+ days straight. Re-add a schedule only when
  # a runner with a real eval stack exists (e.g. a self-hosted runner on
  # the GPU server).
  workflow_dispatch:
    inputs:
      threshold:
        description: "Minimum acceptable score ratio vs baseline (e.g. 0.90)"
        required: false
        default: "0.90"

env:
  THAIRAG_API_URL: http://localhost:8080

jobs:
  search-quality:
    name: Search Quality Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Start ThaiRAG (free tier)
        run: docker compose up -d
        env:
          THAIRAG_TIER: free

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "::error::API never became healthy after 150s — evaluation cannot run"
          exit 1

      - name: Run search quality evaluation
        run: |
          THRESHOLD=${{ github.event.inputs.threshold || '0.90' }} \
          bash scripts/search-quality-ci.sh

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-results
          path: /tmp/search-quality-results.json
          retention-days: 30
