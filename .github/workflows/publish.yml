name: Publish Images

# Builds and pushes the three ThaiRAG images (API, admin UI, chat UI) as
# multi-arch manifests (linux/amd64 + linux/arm64) to GHCR and Docker Hub
# on every push to main. Tags: `latest` + short commit SHA — the scheme
# docker-compose.registry.yml and docs/DEPLOYMENT_GUIDE.md already use.
#
# Each arch builds NATIVELY (ubuntu-24.04 for amd64, ubuntu-24.04-arm for
# arm64 — free for public repos) and pushes by digest; a merge job then
# stitches the digests into one multi-arch manifest per registry. No QEMU:
# emulating the Rust workspace build would blow past job time limits.
#
# The PaddleOCR sidecar image is NOT built here — it changes rarely and is
# opt-in; publish it manually when its Dockerfile changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_NS: ghcr.io/jay-githubs
  HUB_NS: docker.io/jdevspecialist

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: thairag
            context: .
          - name: thairag-admin
            context: ./admin-ui
          - name: thairag-chat
            context: ./chat-ui
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jdevspecialist
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,"name=${{ env.GHCR_NS }}/${{ matrix.image.name }},${{ env.HUB_NS }}/${{ matrix.image.name }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [thairag, thairag-admin, thairag-chat]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jdevspecialist
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        working-directory: /tmp/digests
        run: |
          short_sha="${GITHUB_SHA::7}"
          for repo in "${GHCR_NS}/${{ matrix.image }}" "${HUB_NS}/${{ matrix.image }}"; do
            docker buildx imagetools create \
              -t "${repo}:latest" \
              -t "${repo}:${short_sha}" \
              $(printf -- "${repo}@sha256:%s " *)
          done

      - name: Inspect published manifest
        run: |
          short_sha="${GITHUB_SHA::7}"
          docker buildx imagetools inspect "${GHCR_NS}/${{ matrix.image }}:${short_sha}"
