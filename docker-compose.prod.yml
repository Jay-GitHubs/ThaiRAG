# ── Production Docker Compose ────────────────────────────────────────────────
# Usage:
#   cp .env.prod.example .env.prod   # fill in secrets
#   ./scripts/deploy.sh              # first-time setup + deploy
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# All services are isolated on internal networks. Only nginx exposes ports 80/443.

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1000
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Qdrant (vector database) ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      # The qdrant image ships no wget/curl — probe the HTTP port over
      # /dev/tcp (bash builtin) instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── ThaiRAG API ────────────────────────────────────────────────────────────
  # Pulls the published image by default; `build:` remains for source deploys
  # (`docker compose -f docker-compose.prod.yml build`). `pull_policy: missing`
  # makes `up` pull instead of building — a VM without the source tree (or the
  # RAM for a Rust workspace build) deploys straight from the registry.
  thairag:
    image: ${THAIRAG_IMAGE:-ghcr.io/jay-githubs/thairag}:${THAIRAG_TAG:-latest}
    build: .
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - thairag-data:/data
    env_file: .env.prod
    environment:
      THAIRAG__SERVER__HOST: "0.0.0.0"
      THAIRAG__SERVER__PORT: "8080"
      THAIRAG_TIER: ${THAIRAG_TIER:-standard}
    networks:
      # backend is internal-only (no egress) — the API must ALSO join
      # frontend or it cannot reach any LLM/embedding provider (hosted APIs,
      # gateways, model downloads). Datastores stay backend-only.
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # The runtime image (debian slim) ships no wget/curl — do the HTTP GET
      # with bash's /dev/tcp and check for a 200.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ── Admin UI ───────────────────────────────────────────────────────────────
  # The published image is a self-contained nginx: SPA + /api,/v1,/health,
  # /metrics proxying to `thairag` with correct SSE handling. The outer nginx
  # exposes it on its own HTTPS port (8443) — the SPA is built with Vite base
  # `/`, so it cannot be served under a sub-path like /admin/ (root-absolute
  # asset URLs would 404).
  admin-ui:
    image: ${THAIRAG_ADMIN_IMAGE:-ghcr.io/jay-githubs/thairag-admin}:${THAIRAG_TAG:-latest}
    build: ./admin-ui
    pull_policy: missing
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - thairag
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Chat UI (first-party end-user frontend, served at the root domain) ─────
  chat-ui:
    image: ${THAIRAG_CHAT_IMAGE:-ghcr.io/jay-githubs/thairag-chat}:${THAIRAG_TAG:-latest}
    build: ./chat-ui
    pull_policy: missing
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - thairag
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.10.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
    depends_on:
      - thairag
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://${DOMAIN}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Nginx (TLS termination + reverse proxy) ────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"   # Admin UI (own port — the SPA can't live under /admin/)
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    networks:
      - frontend
      - backend
    depends_on:
      thairag:
        condition: service_healthy
      admin-ui:
        condition: service_started
      chat-ui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # no direct external access to backend services

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local
  thairag-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  nginx-logs:
    driver: local
